name: Update EGX prices

on:
  schedule:
    # 18:23 UTC, Sun-Thu: a few hours after EGX closes (~14:30 Cairo)
    - cron: "23 18 * * 0-4"
    # 06:23 UTC daily: catch-up run
    - cron: "23 6 * * *"
  push:
    paths:
      - "scraper/**"
      - "data/tickers.json"
      - ".github/workflows/update.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scraper/fetch_egx.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update EGX prices"
          git pull --rebase origin main
          git push
