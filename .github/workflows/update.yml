name: Update EGX prices

on:
  schedule:
    # Every 30 min during the EGX session (Sun-Thu). Window is wide enough
    # to cover both Cairo summer and winter time.
    - cron: "*/30 6-12 * * 0-4"
    # One final run after the close
    - cron: "45 13 * * 0-4"
  push:
    paths:
      - "scraper/fetch_egx.py"
      - "data/tickers.json"
      - ".github/workflows/update.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scraper/fetch_egx.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update EGX prices"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 3
          done
