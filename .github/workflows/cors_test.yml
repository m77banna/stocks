name: CORS test

on:
  push:
    paths:
      - ".github/workflows/cors_test.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the scanner the way a browser on GitHub Pages would
        run: |
          U=https://scanner.tradingview.com/egypt/scan
          {
            echo "== preflight (OPTIONS) from https://m77banna.github.io"
            curl -s -i -X OPTIONS "$U" -H "Origin: https://m77banna.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | head -30
            echo
            echo "== POST with that Origin"
            curl -s -i -X POST "$U" -H "Origin: https://m77banna.github.io" -H "Content-Type: application/json" -d '{"symbols":{"tickers":["EGX:ETEL"]},"columns":["close"]}' | head -30
            echo
            echo "== POST without Origin header"
            curl -s -i -X POST "$U" -H "Content-Type: application/json" -d '{"symbols":{"tickers":["EGX:ETEL"]},"columns":["close"]}' | head -20
          } > data/cors_test.txt 2>&1
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cors_test.txt
          git diff --cached --quiet && echo "No changes" || git commit -m "CORS test result"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 3
          done
