name: TradingView test

on:
  push:
    paths:
      - "scraper/tv_test.py"
      - ".github/workflows/tv_test.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scraper/tv_test.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tv_test.json
          git diff --cached --quiet && echo "No changes" || git commit -m "TradingView test result"
          git pull --rebase origin main
          git push
