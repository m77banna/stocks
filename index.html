<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محفظتى</title>
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --sub:#64748b; --border:#e2e8f0;
    --up:#16a34a; --down:#dc2626; --accent:#2563eb;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --card:#111a2b; --text:#e5e9f0; --sub:#8b96a8; --border:#243044;
      --up:#22c55e; --down:#f87171; --accent:#60a5fa;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --card:#111a2b; --text:#e5e9f0; --sub:#8b96a8; --border:#243044;
    --up:#22c55e; --down:#f87171; --accent:#60a5fa;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:13.5px;}
  .wrap{padding:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;margin-bottom:8px;}
  button,.btn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;font:inherit;}
  .scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1250px;}
  th{color:var(--sub);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;text-align:right;}
  td,th{border-bottom:1px solid var(--border);padding:7px 8px;}
  tr:hover td{background:rgba(37,99,235,0.06);}
  .ci{width:100%;box-sizing:border-box;text-align:center;padding:4px 2px;font-size:13px;}
  .ci.t{text-align:right;}
  .up{color:var(--up)}.down{color:var(--down)}.sub{color:var(--sub)}
  .del{color:var(--down);border:none;background:none;}
  h1{font-size:18px;margin:0 0 2px;}
  .head{margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card bar">
    <button class="primary" id="addRow">+ إضافة سهم</button>
    <button id="saveFile">⬇ حفظ كملف</button>
    <label class="btn">⬆ استيراد ملف<input type="file" id="loadFile" accept=".json" hidden></label>
    <button id="refreshBtn">↻ تحديث الأسعار</button>
    <button id="resetBtn">↺ استرجاع الأصلى</button>
    <span id="upd" class="sub"></span>
    <span id="msg" class="down"></span><span id="totals" class="sub" style="margin-inline-start:auto"></span>
  </div>

  <div class="card scroll">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

": "Pharmaceuticals", "shares": 1.0, "eps": 0.8571428571, "price": 12.0, "target": 17.26, "myWeight": 5.0, "fpe": 16.61}, {"id": "s29", "symbol": "AMES", "name": "New Medical Center", "aname": "المركز الطبى الجديد", "industry": "Medical", "shares": 0.2391304348, "eps": 0.4299065421, "price": 46.0, "target": null, "myWeight": 5.0, "fpe": 13.82}, {"id": "s30", "symbol": "OIH", "name": "Orascom Investment", "aname": "أوراسكوم للاتصالات", "industry": "Tech", "shares": 5.0, "eps": -0.1111111111, "price": 2.0, "target": null, "myWeight": 5.0, "fpe": 16.78}, {"id": "s31", "symbol": "OLFI", "name": "Obour Land", "aname": "عبور لاند", "industry": "Food", "shares": 0.380952381, "eps": 1.9090909091, "price": 21.0, "target": 26.0, "myWeight": 5.0, "fpe": 18.12}, {"id": "s32", "symbol": "MPCI", "name": "Memphis", "aname": "ممفيس للأدوية", "industry": "Pharmaceuticals", "shares": 0.0231213873, "eps": 23.0666666667, "price": 346.0, "target": null, "myWeight": 5.0, "fpe": 16.61}, {"id": "s33", "symbol": "BONY", "name": "Bonyan", "aname": "بنيان", "industry": "Real Estate", "shares": 1.9093078759, "eps": 1.0826873385, "price": 4.19, "target": 6.27, "myWeight": 5.0, "fpe": 12.71}, {"id": "s34", "symbol": "AXPH", "name": "Alexandria Pharma", "aname": "الأسكندرية للأدوية", "industry": "Pharmaceuticals", "shares": 0.0046791444, "eps": 99.7333333333, "price": 1496.0, "target": null, "myWeight": 5.0, "fpe": 16.61}, {"id": "s35", "symbol": "AMER", "name": "Amer Group", "aname": "عامر جروب", "industry": "Real Estate", "shares": 1.0, "eps": 0.3333333333, "price": 5.0, "target": null, "myWeight": 5.0, "fpe": 12.71}, {"id": "s36", "symbol": "LUTS", "name": "Lotus", "aname": "لوتس", "industry": "Food", "shares": 1.3333333333, "eps": null, "price": 0.855, "target": null, "myWeight": 5.0, "fpe": 18.12}];
const LS = 'egx_portfolio_static_v1';
function migrate(a){ return a.map(s=>{ if(s.shares!==undefined) return s; const o={...s}; o.shares=(s.cap!=null&&s.price)?s.cap/s.price:null; o.eps=(s.pe&&s.price)?s.price/s.pe:null; delete o.cap; delete o.pe; return o; }); }
function load(){ try{ const v = JSON.parse(localStorage.getItem(LS)); if(Array.isArray(v)) return migrate(v); }catch(e){} return JSON.parse(JSON.stringify(SEED)); }
function persist(){ try{ localStorage.setItem(LS, JSON.stringify(stocks)); }catch(e){} }
let stocks = load();
let nextId = Math.max(0, ...stocks.map(s=>parseInt(String(s.id||'s0').slice(1))||0)) + 1;
let sortKey = 'cap', sortDir = 'desc';
let pendingDel = null, delTimer = null, resetPending = false, resetTimer = null;
function say(t){ const m=document.getElementById('msg'); m.textContent=t; setTimeout(()=>{ if(m.textContent===t) m.textContent=''; },4000); }

const COLS = [
  {k:'symbol',l:'الرمز',t:'str',w:'7%'},{k:'name',l:'الاسم',t:'str',w:'14%'},{k:'industry',l:'القطاع',t:'str',w:'10%'},
  {k:'cap',l:'القيمة السوقية',t:'num',w:'7%'},{k:'weight',l:'الوزن %',t:'num',w:'6%'},{k:'myWeight',l:'وزنى',t:'num',w:'5.5%'},
  {k:'price',l:'السعر',t:'num',w:'6.5%'},{k:'pe',l:'PE',t:'num',w:'5.5%'},{k:'eps',l:'EPS',t:'num',w:'6%'},
  {k:'target',l:'القيمة المتوقعة',t:'num',w:'7%'},{k:'upside',l:'الارتفاع %',t:'num',w:'6.5%'},
  {k:'cfv',l:'قيمة تقريبية',t:'num',w:'7%'},{k:'cupside',l:'ارتفاع تقريبى %',t:'num',w:'7.5%'},{k:'del',l:'',t:'none',w:'3.5%'}
];

const FPE=Object.fromEntries(SEED.map(s=>[s.symbol,s.fpe])), FPE_DEFAULT=13.82;
function enrich(){
  const rows = stocks.map(r=>({...r,
    cap: (r.shares!=null && r.price!=null) ? r.shares*r.price : null,
    pe: (r.eps && r.price!=null) ? r.price/r.eps : null
  }));
  const tot = rows.reduce((s,r)=>s+(r.cap||0),0);
  return rows.map(r=>{
    const fpe = FPE[r.symbol] ?? FPE_DEFAULT;
    const ok = r.pe!=null && r.pe>=3 && r.pe<=50 && r.eps>0 && r.price>0;
    const cfv = ok ? +(r.price*Math.min(Math.max(((r.price+r.eps*fpe)/2)/r.price,0.6),1.6)).toFixed(2) : null;
    return {...r, cfv,
      upside: (r.target!=null && r.price) ? +(((r.target-r.price)/r.price)*100).toFixed(2) : null,
      cupside: (cfv!=null && r.price) ? +(((cfv-r.price)/r.price)*100).toFixed(2) : null,
      weight: (tot>0 && r.cap!=null) ? +((r.cap/tot)*100).toFixed(2) : null};
  });
}
const fmt=(n,s='')=> n==null||isNaN(n)?'—':n.toLocaleString('en-US',{maximumFractionDigits:2})+s;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function head(){
  const h=document.getElementById('headRow');
  h.innerHTML=COLS.map(c=>c.t==='none'?`<th style="width:${c.w}"></th>`:`<th data-k="${c.k}" style="width:${c.w}">${c.l}${sortKey===c.k?(sortDir==='asc'?' ▲':' ▼'):''}</th>`).join('');
  h.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir=sortDir==='asc'?'desc':'asc';
    else {sortKey=k; sortDir=COLS.find(c=>c.k===k).t==='str'?'asc':'desc';}
    head(); render();
  });
}

function render(){
  const col=COLS.find(c=>c.k===sortKey), rows=enrich();
  rows.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(col.t==='str') return sortDir==='asc'?String(x||'').localeCompare(String(y||'')):String(y||'').localeCompare(String(x||''));
    x=x==null?-Infinity:x; y=y==null?-Infinity:y;
    return sortDir==='asc'?x-y:y-x;
  });
  const tot=rows.reduce((s,r)=>s+(r.cap||0),0), myTot=stocks.reduce((s,r)=>s+(r.myWeight||0),0);
  document.getElementById('totals').textContent=`${stocks.length} سهم — إجمالى القيمة السوقية: ${fmt(tot)} — مجموع وزنى: ${fmt(myTot)}`;
  const num=(r,f)=>`<td><input type="number" step="any" class="ci" data-f="${f}" value="${r[f]==null?'':+Number(r[f]).toFixed(4)}"></td>`;
  document.getElementById('rows').innerHTML=rows.map(r=>{
    const u=r.upside==null?'sub':(r.upside>=0?'up':'down');
    return `<tr data-id="${r.id}">
      <td><input class="ci t" data-f="symbol" value="${esc(r.symbol)}"></td>
      <td><input class="ci t" data-f="name" value="${esc(r.name)}" title="${esc(r.aname)}"></td>
      <td><input class="ci t" data-f="industry" value="${esc(r.industry)}"></td>
      ${num(r,'cap')}
      <td><b>${fmt(r.weight,'%')}</b></td>
      ${num(r,'myWeight')}${num(r,'price')}${num(r,'pe')}
      ${num(r,'eps')}
      ${num(r,'target')}
      <td class="${u}"><b>${fmt(r.upside,'%')}</b></td>
      <td>${fmt(r.cfv)}</td>
      <td class="${r.cupside==null?'sub':(r.cupside>=0?'up':'down')}"><b>${fmt(r.cupside,'%')}</b></td>
      <td>${pendingDel===r.id?`<button class="del" data-del="${r.id}" style="font-weight:700;white-space:nowrap">تأكيد؟</button>`:`<button class="del" data-del="${r.id}">✕</button>`}</td></tr>`;
  }).join('');
  document.querySelectorAll('[data-f]').forEach(i=>i.onchange=e=>{
    const s=stocks.find(x=>x.id===e.target.closest('tr').dataset.id), f=e.target.dataset.f;
    if(!s) return;
    if(['cap','myWeight','price','pe','eps','target'].includes(f)){
      const v=parseFloat(e.target.value), val=isNaN(v)?null:v;
      if(f==='cap'){ if(val==null) s.shares=null; else if(s.price) s.shares=val/s.price; else say('أدخل السعر الأول'); }
      else if(f==='pe'){ if(val==null) s.eps=null; else if(val!==0 && s.price) s.eps=s.price/val; else say('أدخل السعر الأول'); }
      else s[f]=val;
    } else s[f]=e.target.value;
    persist(); render();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;
    if(pendingDel===id){ clearTimeout(delTimer); pendingDel=null; stocks=stocks.filter(s=>s.id!==id); persist(); render(); return; }
    pendingDel=id; clearTimeout(delTimer); delTimer=setTimeout(()=>{ pendingDel=null; render(); },3000); render();
  });
}

document.getElementById('addRow').onclick=()=>{
  stocks.push({id:'s'+(nextId++),symbol:'NEW',name:'',aname:'',industry:'',shares:null,eps:null,price:null,target:null,myWeight:null});
  persist(); render();
};
document.getElementById('saveFile').onclick=()=>{
  const blob=new Blob([JSON.stringify(stocks,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='egx-portfolio-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById('loadFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{ try{
    const d=JSON.parse(ev.target.result); if(!Array.isArray(d)) throw 0;
    stocks=migrate(d); nextId=Math.max(0,...stocks.map(s=>parseInt(String(s.id||'s0').slice(1))||0))+1; persist(); render();
  }catch(_){ say('الملف مش بصيغة صحيحة'); } };
  r.readAsText(f);
};
document.getElementById('resetBtn').onclick=e=>{
  const b=e.currentTarget;
  if(!resetPending){ resetPending=true; b.textContent='تأكيد الاسترجاع؟'; resetTimer=setTimeout(()=>{ resetPending=false; b.textContent='↺ استرجاع الأصلى'; },3000); return; }
  clearTimeout(resetTimer); resetPending=false; b.textContent='↺ استرجاع الأصلى';
  stocks=JSON.parse(JSON.stringify(SEED)); persist(); render();
};
async function fetchLatest(){
  const st=document.getElementById('upd');
  try{
    const r=await fetch('data/latest.json?_='+Date.now()); if(!r.ok) throw 0;
    const j=await r.json(), by={};
    (j.stocks||[]).forEach(s=>{ if(!s.error && s.price!=null) by[s.symbol]=s; });
    let n=0; stocks.forEach(s=>{ const l=by[s.symbol]; if(l){ s.price=l.price; n++; } });
    if(n){ persist(); render(); st.textContent='آخر تحديث: '+new Date(j.updated_at).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})+' ('+n+' سهم، متأخرة ~15 دقيقة)'; }
    else st.textContent='لسه مفيش أسعار محدثة';
  }catch(e){ st.textContent='تعذر قراءة الأسعار المحدثة'; }
}
document.getElementById('refreshBtn').onclick=fetchLatest;
