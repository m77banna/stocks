<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --sub:#64748b; --border:#e2e8f0;
    --up:#16a34a; --down:#dc2626; --accent:#2563eb;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --card:#111a2b; --text:#e5e9f0; --sub:#8b96a8; --border:#243044;
      --up:#22c55e; --down:#f87171; --accent:#60a5fa;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --card:#111a2b; --text:#e5e9f0; --sub:#8b96a8; --border:#243044;
    --up:#22c55e; --down:#f87171; --accent:#60a5fa;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:13.5px;}
  .wrap{padding:0;height:100%;display:flex;flex-direction:column;}
  .card{background:var(--card);border-bottom:1px solid var(--border);}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;flex:0 0 auto;}
  button,.btn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;font:inherit;}
  .scroll{flex:1 1 auto;min-height:0;overflow:auto;}
  table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:1300px;}
  th{position:sticky;top:0;z-index:2;background:var(--card);color:var(--sub);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;text-align:left;}
  td,th{border-bottom:1px solid var(--border);padding:7px 8px;}
  tr:hover td{background:rgba(37,99,235,0.06);}
  .ci{width:100%;box-sizing:border-box;text-align:left;padding:4px 6px;font-size:13px;}
  .ci.t{text-align:left;}
  .ci.man{font-style:italic;border-style:dashed;}
  td.n{text-align:left;}
  td.tx{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up{color:var(--up)}.down{color:var(--down)}.sub{color:var(--sub)}
  .del{color:var(--down);border:none;background:none;padding:2px 4px;white-space:nowrap;}
  td.act{overflow:visible;white-space:nowrap;}
  h1{font-size:18px;margin:0 0 2px;}
  .head{margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card bar">
    <input id="newSym" placeholder="Ticker, e.g. COMI" maxlength="12" autocomplete="off" style="width:150px;padding:4px 8px;text-transform:uppercase">
    <button class="primary" id="addRow">+ Add stock</button>
    <button id="refreshBtn">↻ Refresh prices</button>
    <button id="gearBtn" title="GitHub token settings">⚙</button>
    <span id="dirty" class="down"></span>
    <span id="upd" class="sub"></span>
    <span id="msg"></span><span id="totals" class="sub" style="margin-inline-start:auto"></span>
  </div>

  <div class="card bar" id="settings" style="display:none;flex-direction:column;align-items:flex-start">
    <div><b>GitHub token</b> <span class="sub">— needed only to save. It is kept in this browser only and never written to any file.</span></div>
    <div class="sub">Create a fine-grained token for the repository <b>m77banna/stocks</b> with <b>Contents: Read and write</b>.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;width:100%">
      <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" style="flex:1;min-width:240px;padding:4px 8px">
      <button id="tokSave" class="primary">Save token</button>
      <button id="tokClear">Remove token</button>
    </div>
  </div>

  <div class="card scroll">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const OWNER='m77banna', REPO='stocks', BRANCH='main', PATH='data/portfolio.json';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
const TK='egx_gh_token';
const getTok=()=>{ try{ return localStorage.getItem(TK)||''; }catch(e){ return ''; } };
const setTok=v=>{ try{ if(v) localStorage.setItem(TK,v); else localStorage.removeItem(TK); }catch(e){} };

let stocks = [], nextId = 1, dirty = false, techMap = {}, liveMap = {};
const PE_TIP={ttm:'TradingView trailing P/E (last 12 months)',eps_ttm:'Price ÷ last-12-month EPS (TradingView)',ni_ttm:'Market cap ÷ last-12-month net profit (TradingView)',eps_fy:'Price ÷ last fiscal-year EPS (TradingView) — may be dated',ni_fy:'Market cap ÷ last fiscal-year net profit (TradingView) — may be dated'};
function peCell(r){
  return r.pe!=null ? `<td class="n" title="${esc(PE_TIP[r.L.pe_src]||'TradingView')}">${fmt(r.pe)}</td>` : '<td class="sub" title="No earnings data (loss-making or not reported)">—</td>';
}
function pegCell(r){
  if(r.peg==null) return `<td class="sub" title="${esc(r.L.eps_growth!=null?'PEG not meaningful: earnings are not growing ('+r.L.eps_growth+'%)':'No earnings-growth data')}">—</td>`;
  return `<td class="n" title="${esc('P/E ÷ EPS growth ('+r.L.eps_growth+'% over the '+r.L.eps_growth_basis+', year on year) — below 1 means cheap relative to growth. Nominal growth is inflated by Egyptian inflation.')}">${fmt(r.peg,'',2)}</td>`;
}
function epsCell(r){
  return r.eps!=null ? `<td class="n" title="${esc('Earnings per share, same basis as the P/E — TradingView')}">${fmt(r.eps,'',2)}</td>` : '<td class="sub" title="No earnings data">—</td>';
}
function pctSpan(v){
  if(v==null||isNaN(v)) return '';
  const a=Math.abs(v), shown=fmt(a,'%');
  if(Math.round(a)===0) return `<b>● ${shown}</b>`;
  return v>0 ? `<b>▲ ${shown}</b>` : `<b>▼ ${shown}</b>`;
}
function targetCell(r){
  if(r.target==null) return '<td class="sub" title="No analyst price target available">—</td>';
  const L=r.L, rng=(L.target_lo!=null&&L.target_hi!=null)?`; range ${fmt(L.target_lo)}–${fmt(L.target_hi)}`:'';
  const cls = r.upside==null||Math.round(Math.abs(r.upside))===0 ? '' : (r.upside>0 ? 'up' : 'down');
  return `<td class="${cls}" title="${esc('Analyst average price target'+(L.target_n?` (${L.target_n} analysts)`:'')+rng+'; the arrow is the distance from the current price — TradingView')}">${fmt(r.target)} ${pctSpan(r.upside)}</td>`;
}
function analystLabel(m){ if(m==null) return null; if(m<=1.5) return {t:'▲▲ Strong buy',c:'up'}; if(m<=2.5) return {t:'▲ Buy',c:'up'}; if(m<=3.5) return {t:'● Hold',c:'sub'}; if(m<=4.5) return {t:'▼ Sell',c:'down'}; return {t:'▼▼ Strong sell',c:'down'}; }
function analystCell(r){
  const a=analystLabel(r.L.analyst); if(!a) return '<td class="sub" title="No analyst coverage">—</td>';
  return `<td class="${a.c}" title="${esc('Analyst consensus '+r.L.analyst+' (1 = strong buy … 5 = strong sell)'+(r.L.target_n?` from ${r.L.target_n} analysts`:'')+' — TradingView')}"><b>${a.t}</b></td>`;
}
function divCells(r){
  const d=r.dv;
  if(!d) return '<td class="sub" title="No dividend record found">—</td><td class="sub">—</td>';
  const dt=new Date(d.date+'T00:00:00Z'), old=(Date.now()-dt.getTime())>3*365*864e5;
  const txt=dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
  const tip=esc('Ex-dividend date'+(d.pay?'; paid '+d.pay:'')+(d.yld!=null?'; yield '+d.yld+'%':'')+' — '+d.src);
  return `<td class="${old?'sub':''}" title="${tip}">${txt}</td><td title="${tip}">${fmt(d.amt,'',2)}</td>`;
}
function techLabel(v){ if(v==null) return null; if(v>0.5) return {t:'▲▲ Strong buy',c:'up'}; if(v>0.1) return {t:'▲ Buy',c:'up'}; if(v>=-0.1) return {t:'● Neutral',c:'sub'}; if(v>=-0.5) return {t:'▼ Sell',c:'down'}; return {t:'▼▼ Strong sell',c:'down'}; }
let sortKey = 'cap', sortDir = 'desc';
let pendingDel = null, delTimer = null;
function say(t, ok){ const m=document.getElementById('msg'); m.textContent=t; m.className=ok?'up':'down'; setTimeout(()=>{ if(m.textContent===t) m.textContent=''; },5000); }
let saveTimer=null, saving=false, saveAgain=false;
function markDirty(){
  dirty=true; showDirty(); clearTimeout(saveTimer);
  if(getTok()) saveTimer=setTimeout(save,1200);
  else say('Add a GitHub token in ⚙ so changes are saved automatically');
}
function showDirty(){ document.getElementById('dirty').textContent = dirty ? '● Saving…' : ''; }
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

const COLS = [
  {k:'symbol',l:'Symbol',t:'str',w:'5.5%'},{k:'name',l:'Name',t:'str',w:'11%'},
  {k:'cap',l:'Market cap',t:'num',w:'7%'},
  {k:'price',l:'Price',t:'num',w:'6%'},{k:'pe',l:'PE',t:'num',w:'5%'},{k:'peg',l:'PEG',t:'num',w:'5.5%'},{k:'eps',l:'EPS',t:'num',w:'5.5%'},
  {k:'upside',l:'Target (upside)',t:'num',w:'10%'},
  {k:'tv',l:'Technical',t:'num',w:'9.5%'},{k:'alv',l:'Analysts',t:'num',w:'9.5%'},
  {k:'divd',l:'Last dividend',t:'num',w:'8%'},{k:'diva',l:'Dividend / share',t:'num',w:'6.5%'},{k:'del',l:'',t:'none',w:'5.5%'}
];

function enrich(){
  return stocks.map(r=>{
    const L=liveMap[r.symbol]||{};
    const cap = (L.cap_bn!=null) ? L.cap_bn : ((r.shares!=null && L.price!=null) ? r.shares*L.price : null);
    const price = L.price!=null ? L.price : null;
    const pe = L.pe!=null ? L.pe : null, target = L.target!=null ? L.target : null;
    const tv = techMap[r.symbol]!=null ? techMap[r.symbol] : null;
    const dv = L.div_date ? {date:L.div_date,pay:L.div_pay,amt:L.div_amt,yld:L.div_yield,src:L.div_src||'TradingView'} : null;
    return {...r, name:L.name||r.name||'', industry:L.sector||r.industry||'', price, cap, pe, target, eps:(L.eps!=null?L.eps:null), peg:(L.peg!=null?L.peg:null), L, tv, alv:(L.analyst!=null?6-L.analyst:null), dv,
      divd: dv?Date.parse(dv.date):null, diva: dv?dv.amt:null,
      upside: (target!=null && price) ? +(((target-price)/price)*100).toFixed(2) : null,
      };
  });
}
const fmt=(n,s='',d=0)=> n==null||isNaN(n)?'—':n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+s;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function head(){
  const h=document.getElementById('headRow');
  h.innerHTML=COLS.map(c=>c.t==='none'?`<th style="width:${c.w}"></th>`:`<th data-k="${c.k}" style="width:${c.w}">${c.l}${sortKey===c.k?(sortDir==='asc'?' ▲':' ▼'):''}</th>`).join('');
  h.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir=sortDir==='asc'?'desc':'asc';
    else {sortKey=k; sortDir=COLS.find(c=>c.k===k).t==='str'?'asc':'desc';}
    head(); render();
  });
}

function render(){
  const col=COLS.find(c=>c.k===sortKey), rows=enrich();
  rows.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(col.t==='str') return sortDir==='asc'?String(x||'').localeCompare(String(y||'')):String(y||'').localeCompare(String(x||''));
    x=x==null?-Infinity:x; y=y==null?-Infinity:y;
    return sortDir==='asc'?x-y:y-x;
  });
  const tot=rows.reduce((s,r)=>s+(r.cap||0),0);
  document.getElementById('totals').textContent=`${stocks.length} stocks — Total market cap: ${fmt(tot)}`;
  const num=(r,f)=>`<td><input type="number" step="any" class="ci" data-f="${f}" value="${r[f]==null?'':Number(r[f]).toFixed(0)}"></td>`;
  document.getElementById('rows').innerHTML=rows.map(r=>{
    const u=r.upside==null?'sub':(r.upside>=0?'up':'down');
    return `<tr data-id="${r.id}">
      <td class="n"><b>${esc(r.symbol)}</b></td>
      <td class="tx" title="${esc(r.name)}">${esc(r.name)}</td>
      <td class="n">${fmt(r.cap)}</td>
      <td class="n">${fmt(r.price,'',1)}</td>${peCell(r)}
      ${pegCell(r)}
      ${epsCell(r)}
      ${targetCell(r)}
      ${(()=>{ const t=techLabel(r.tv); return t?`<td class="${t.c}" title="TradingView technical rating (moving averages + oscillators): ${r.tv.toFixed(2)}"><b>${t.t}</b></td>`:'<td class="sub">—</td>'; })()}
      ${analystCell(r)}
      ${divCells(r)}
      <td class="act">${pendingDel===r.id?`<button class="del" data-del="${r.id}" style="font-weight:700;white-space:nowrap">Delete?</button>`:`<button class="del" data-del="${r.id}">✕</button>`}</td></tr>`;
  }).join('');
  document.querySelectorAll('[data-f]').forEach(i=>i.onchange=e=>{
    const s=stocks.find(x=>x.id===e.target.closest('tr').dataset.id), f=e.target.dataset.f;
    if(!s) return;
    if(['pe','target'].includes(f)){ const v=parseFloat(e.target.value); s[f]=isNaN(v)?null:v; }
    else s[f]=e.target.value;
    markDirty(); render();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;
    if(pendingDel===id){ clearTimeout(delTimer); pendingDel=null; stocks=stocks.filter(s=>s.id!==id); markDirty(); render(); return; }
    pendingDel=id; clearTimeout(delTimer); delTimer=setTimeout(()=>{ pendingDel=null; render(); },3000); render();
  });
}

const TICKERS_API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/data/tickers.json`;
const LATEST_API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/data/latest.json`;

async function getRepoJson(path){
  const tok=getTok();
  if(tok){ try{
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw'},cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){} }
  const r=await fetch(path+'?_='+Date.now()); if(!r.ok) throw new Error(path+' '+r.status);
  return r.json();
}
async function getLatest(){
  const tok=getTok();
  if(tok){ try{
    const r=await fetch(LATEST_API+'?ref='+BRANCH,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw'},cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){} }
  const r=await fetch('data/latest.json?_='+Date.now()); if(!r.ok) throw new Error('latest.json '+r.status);
  return r.json();
}
async function addTicker(tok,sym){
  const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
  for(let a=0;a<2;a++){
    const r=await fetch(TICKERS_API+'?ref='+BRANCH,{headers:H,cache:'no-store'});
    if(r.status===401||r.status===403) throw new Error('token rejected');
    if(!r.ok) throw new Error('GitHub '+r.status);
    const j=await r.json();
    const arr=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
    if(arr.some(t=>t.symbol===sym)) return;
    arr.push({symbol:sym,name:''});
    const p=await fetch(TICKERS_API,{method:'PUT',headers:{...H,'Content-Type':'application/json'},
      body:JSON.stringify({message:'Add ticker '+sym,content:b64(JSON.stringify(arr,null,2)+'\n'),sha:j.sha,branch:BRANCH})});
    if(p.ok) return;
    if(p.status===401||p.status===403) throw new Error('token rejected');
    if(p.status!==409&&p.status!==422) throw new Error('GitHub '+p.status);
  }
  throw new Error('conflict, try again');
}
async function addStock(){
  const inp=document.getElementById('newSym');
  const sym=inp.value.trim().toUpperCase().replace(/^EGX:/,'').replace(/\.CA$/,'');
  if(!sym){ say('Enter a ticker first, e.g. COMI'); return; }
  if(!/^[A-Z0-9]{2,12}$/.test(sym)){ say('Enter a valid ticker, e.g. COMI'); return; }
  if(stocks.some(s=>s.symbol===sym)){ say(sym+' is already in the list'); return; }
  const tok=getTok();
  if(!tok){ document.getElementById('settings').style.display='flex'; say('Add a GitHub token in ⚙ to look up new tickers'); return; }
  const s={id:'s'+(nextId++),symbol:sym,name:'',shares:null};
  stocks.push(s); inp.value=''; markDirty(); render();
  say('Looking up '+sym+'…', true);
  try{ await fetchLive(); }catch(e){ try{ await fetchLatest(); }catch(e2){} }
  if(!liveMap[sym]){ say('No data found for '+sym+' — remove it with ✕'); }
  else say(sym+' added', true);
  try{ await addTicker(tok,sym); }catch(e){ say('Could not register '+sym+' for background updates: '+e.message); }
}
document.getElementById('addRow').onclick=addStock;
document.getElementById('newSym').addEventListener('keydown',e=>{ if(e.key==='Enter') addStock(); });

const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function getSha(tok){
  const r=await fetch(API+'?ref='+BRANCH,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GitHub '+r.status);
  return (await r.json()).sha;
}
async function putFile(tok,content,sha){
  return fetch(API,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({message:'Update portfolio',content,branch:BRANCH,...(sha?{sha}:{})})});
}
async function syncTickers(tok){
  const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
  const r=await fetch(TICKERS_API+'?ref='+BRANCH,{headers:H,cache:'no-store'}); if(!r.ok) return;
  const j=await r.json(), arr=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
  const want=stocks.map(s=>s.symbol).filter(Boolean), have=arr.map(t=>t.symbol);
  if(want.length===have.length && want.every(s=>have.includes(s))) return;
  const by=Object.fromEntries(arr.map(t=>[t.symbol,t]));
  const next=want.map(s=>by[s]||{symbol:s,name:''});
  await fetch(TICKERS_API,{method:'PUT',headers:{...H,'Content-Type':'application/json'},
    body:JSON.stringify({message:'Sync tickers with portfolio',content:b64(JSON.stringify(next,null,2)+'\n'),sha:j.sha,branch:BRANCH})});
}
async function save(){
  const tok=getTok();
  if(!tok){ document.getElementById('settings').style.display='flex'; say('Add a GitHub token in ⚙ to save'); return; }
  if(saving){ saveAgain=true; return; }
  saving=true;
  try{
    const content=b64(JSON.stringify({saved_at:new Date().toISOString(),stocks:stocks.map(s=>({id:s.id,symbol:s.symbol,shares:s.shares??null}))},null,2)+'\n');
    let r=await putFile(tok,content,await getSha(tok));
    if(r.status===409||r.status===422) r=await putFile(tok,content,await getSha(tok));
    if(r.status===401||r.status===403) throw new Error('Token rejected — check it in ⚙');
    if(!r.ok) throw new Error('Save failed ('+r.status+')');
    try{ await syncTickers(tok); }catch(e){}
    dirty=false; showDirty(); say('Saved ✓ '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), true);
  }catch(e){ say(e.message||'Save failed'); }
  saving=false;
  if(saveAgain){ saveAgain=false; save(); }
}
document.getElementById('gearBtn').onclick=()=>{ const s=document.getElementById('settings'); s.style.display=s.style.display==='none'?'flex':'none'; document.getElementById('tok').value=getTok(); };
document.getElementById('tokSave').onclick=()=>{ setTok(document.getElementById('tok').value.trim()); document.getElementById('settings').style.display='none'; say('Token stored in this browser', true); loadData(); };
document.getElementById('tokClear').onclick=()=>{ setTok(''); document.getElementById('tok').value=''; say('Token removed', true); };

async function loadData(){
  const tok=getTok(); let data=null, how='';
  if(tok){
    try{
      const r=await fetch(API+'?ref='+BRANCH,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw'},cache:'no-store'});
      if(r.ok){ data=await r.json(); how='api'; } else say('Token rejected — loaded a read-only copy');
    }catch(e){}
  }
  if(!data){
    try{ const r=await fetch(PATH+'?_='+Date.now()); if(!r.ok) throw 0; data=await r.json(); }
    catch(e){ say('Could not load portfolio data'); return false; }
  }
  stocks=Array.isArray(data)?data:(data.stocks||[]);
  stocks.forEach(s=>{ if(s.pe===undefined) s.pe=(s.eps&&s.price)?s.price/s.eps:null; delete s.eps; });
  nextId=Math.max(0,...stocks.map(s=>parseInt(String(s.id||'s0').slice(1))||0))+1;
  dirty=false; showDirty(); render();
  return true;
}
const TV_URL='https://scanner.tradingview.com/egypt/scan';
const TV_MAIN=['close','market_cap_basic','description','price_earnings_ttm'];
const TV_EXTRA=['earnings_per_share_basic_ttm','earnings_per_share_diluted_fy','net_income_ttm','net_income_fy',
  'price_target_average','price_target_high','price_target_low','recommendation_total','recommendation_mark',
  'dividend_ex_date_recent','dividend_payment_date_recent','dividend_amount_recent','dividends_yield_current',
  'earnings_per_share_diluted_yoy_growth_ttm','earnings_per_share_diluted_yoy_growth_fy'];
// text/plain keeps this a "simple" cross-origin request (no preflight), which TradingView accepts
async function tvScan(symbols, columns){
  const r=await fetch(TV_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},cache:'no-store',
    body:JSON.stringify({symbols:{tickers:symbols.map(s=>'EGX:'+s),query:{types:[]}},columns})});
  if(!r.ok) throw new Error('TradingView '+r.status);
  const out={};
  ((await r.json()).data||[]).forEach(row=>{ out[row.s.split(':')[1]]=Object.fromEntries(columns.map((c,i)=>[c,row.d[i]])); });
  return out;
}
const tsDate=v=>{ if(v==null) return null; const d=new Date(Number(v)*1000); return isNaN(d)?null:d.toISOString().slice(0,10); };
function pickPe(price,cap,ex,peTtm){
  if(peTtm!=null && peTtm>0) return [peTtm,'ttm'];
  const e1=ex.earnings_per_share_basic_ttm, e2=ex.earnings_per_share_diluted_fy, n1=ex.net_income_ttm, n2=ex.net_income_fy;
  if(e1!=null && e1>0 && price) return [price/e1,'eps_ttm'];
  if(n1!=null && n1>0 && cap) return [cap*1e9/n1,'ni_ttm'];
  if(e2!=null && e2>0 && price) return [price/e2,'eps_fy'];
  if(n2!=null && n2>0 && cap) return [cap*1e9/n2,'ni_fy'];
  return [null,null];
}
const rd=(v,n)=>+Number(v).toFixed(n);
function buildItem(sym,r,ex,base){
  const price=rd(r.close,3), cap=r.market_cap_basic?rd(r.market_cap_basic/1e9,2):null;
  const it={symbol:sym,price};
  if(cap) it.cap_bn=cap;
  if(r.description) it.name=r.description;
  const [pe,src]=pickPe(price,cap,ex,r.price_earnings_ttm);
  if(pe!=null){
    it.pe=rd(pe,2); it.pe_src=src; it.eps=rd(price/pe,3);
    let g=null, basis=null;
    for(const [k,tag] of [['ttm','last 12 months'],['fy','last fiscal year']]){ const v=ex['earnings_per_share_diluted_yoy_growth_'+k]; if(v!=null){ g=Number(v); basis=tag; break; } }
    if(g!=null){ it.eps_growth=rd(g,1); it.eps_growth_basis=basis; if(g>0) it.peg=rd(pe/g,2); }
  }
  if(ex.price_target_average){
    it.target=rd(ex.price_target_average,2);
    if(ex.price_target_low) it.target_lo=rd(ex.price_target_low,2);
    if(ex.price_target_high) it.target_hi=rd(ex.price_target_high,2);
    if(ex.recommendation_total) it.target_n=Math.round(ex.recommendation_total);
  }
  if(ex.recommendation_mark!=null) it.analyst=rd(ex.recommendation_mark,2);
  if(ex.dividend_amount_recent && tsDate(ex.dividend_ex_date_recent)){
    it.div_amt=rd(ex.dividend_amount_recent,3); it.div_date=tsDate(ex.dividend_ex_date_recent); it.div_src='TradingView';
    if(tsDate(ex.dividend_payment_date_recent)) it.div_pay=tsDate(ex.dividend_payment_date_recent);
    if(ex.dividends_yield_current!=null) it.div_yield=rd(ex.dividends_yield_current,2);
  } else if(base && base.div_date){ // records only Yahoo has come from the GitHub data
    it.div_amt=base.div_amt; it.div_date=base.div_date; it.div_src=base.div_src; if(base.div_pay) it.div_pay=base.div_pay; if(base.div_yield!=null) it.div_yield=base.div_yield;
  }
  return it;
}
function applyLive(items, techs, label, when){
  let n=0, filled=0;
  stocks.forEach(s=>{
    const it=items[s.symbol]; if(!it) return;
    liveMap[s.symbol]=it; if(techs[s.symbol]!=null) techMap[s.symbol]=techs[s.symbol];
    if(it.cap_bn && it.price) s.shares=it.cap_bn/it.price;
    if(!s.name){ s.name=it.name||''; filled++; }
    n++;
  });
  if(filled) markDirty();
  render();
  document.getElementById('upd').textContent=label+' · '+when+' · '+n+' stocks (source delay ~15 min)';
  return n;
}
async function fetchLive(){
  const syms=stocks.map(s=>s.symbol).filter(Boolean); if(!syms.length) return 0;
  const [main,extra,tech]=await Promise.all([tvScan(syms,TV_MAIN), tvScan(syms,TV_EXTRA).catch(()=>({})), tvScan(syms,['Recommend.All']).catch(()=>({}))]);
  const items={}, techs={};
  syms.forEach(sym=>{ const r=main[sym]; if(r && r.close!=null){ items[sym]=buildItem(sym,r,extra[sym]||{},liveMap[sym]); if(tech[sym] && tech[sym]['Recommend.All']!=null) techs[sym]=rd(tech[sym]['Recommend.All'],3); } });
  return applyLive(items,techs,'● Live',new Date().toLocaleTimeString('en-GB'));
}
async function fetchLatest(){
  const j=await getLatest(), items={}, techs={};
  (j.stocks||[]).forEach(s=>{ if(!s.error && s.price!=null){ items[s.symbol]=s; if(s.tech!=null) techs[s.symbol]=s.tech; } });
  return applyLive(items,techs,'GitHub data (live feed unavailable)',new Date(j.updated_at).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'}));
}
let refreshing=false;
async function refreshAll(){
  if(refreshing) return; refreshing=true;
  try{ await fetchLive(); }
  catch(e){ try{ await fetchLatest(); }catch(e2){ document.getElementById('upd').textContent='Could not read prices'; } }
  refreshing=false;
}
document.getElementById('refreshBtn').onclick=refreshAll;
setInterval(()=>{ if(!document.hidden) refreshAll(); },60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAll(); });
head(); loadData().then(ok=>{ if(ok) refreshAll(); });
</script>
