<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --sub:#64748b; --border:#e2e8f0;
    --up:#16a34a; --down:#dc2626; --accent:#2563eb;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1220; --card:#111a2b; --text:#e5e9f0; --sub:#8b96a8; --border:#243044;
      --up:#22c55e; --down:#f87171; --accent:#60a5fa;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1220; --card:#111a2b; --text:#e5e9f0; --sub:#8b96a8; --border:#243044;
    --up:#22c55e; --down:#f87171; --accent:#60a5fa;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:13.5px;}
  .wrap{padding:0;height:100%;display:flex;flex-direction:column;}
  .card{background:var(--card);border-bottom:1px solid var(--border);}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;flex:0 0 auto;}
  button,.btn{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;font:inherit;}
  .scroll{flex:1 1 auto;min-height:0;overflow:auto;}
  table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:1450px;}
  th{position:sticky;top:0;z-index:2;background:var(--card);color:var(--sub);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;text-align:left;}
  td,th{border-bottom:1px solid var(--border);padding:7px 8px;}
  tr:hover td{background:rgba(37,99,235,0.06);}
  .ci{width:100%;box-sizing:border-box;text-align:left;padding:4px 6px;font-size:13px;}
  .ci.t{text-align:left;}
  td.n{text-align:left;}
  td.tx{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .up{color:var(--up)}.down{color:var(--down)}.sub{color:var(--sub)}
  .del{color:var(--down);border:none;background:none;padding:2px 4px;white-space:nowrap;}
  td.act{overflow:visible;white-space:nowrap;}
  h1{font-size:18px;margin:0 0 2px;}
  .head{margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card bar">
    <input id="newSym" placeholder="Ticker, e.g. COMI" maxlength="12" autocomplete="off" style="width:150px;padding:4px 8px;text-transform:uppercase">
    <button class="primary" id="addRow">+ Add stock</button>
    <button id="saveBtn">💾 Save</button>
    <button id="refreshBtn">↻ Refresh prices</button>
    <button id="gearBtn" title="GitHub token settings">⚙</button>
    <span id="dirty" class="down"></span>
    <span id="upd" class="sub"></span>
    <span id="msg"></span><span id="totals" class="sub" style="margin-inline-start:auto"></span>
  </div>

  <div class="card bar" id="settings" style="display:none;flex-direction:column;align-items:flex-start">
    <div><b>GitHub token</b> <span class="sub">— needed only to save. It is kept in this browser only and never written to any file.</span></div>
    <div class="sub">Create a fine-grained token for the repository <b>m77banna/stocks</b> with <b>Contents: Read and write</b>.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;width:100%">
      <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" style="flex:1;min-width:240px;padding:4px 8px">
      <button id="tokSave" class="primary">Save token</button>
      <button id="tokClear">Remove token</button>
    </div>
  </div>

  <div class="card scroll">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const OWNER='m77banna', REPO='stocks', BRANCH='main', PATH='data/portfolio.json';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
const TK='egx_gh_token', POLL_MS=10000;
const getTok=()=>{ try{ return localStorage.getItem(TK)||''; }catch(e){ return ''; } };
const setTok=v=>{ try{ if(v) localStorage.setItem(TK,v); else localStorage.removeItem(TK); }catch(e){} };

let stocks = [], nextId = 1, dirty = false, outlook = {}, techMap = {};
function pctCell(v){
  if(v==null||isNaN(v)) return '<td class="sub">—</td>';
  const a=Math.abs(v), shown=fmt(a,'%');
  if(Math.round(a)===0) return `<td class="sub"><b>● ${shown}</b></td>`;
  return v>0 ? `<td class="up"><b>▲ ${shown}</b></td>` : `<td class="down"><b>▼ ${shown}</b></td>`;
}
function techLabel(v){ if(v==null) return null; if(v>0.5) return {t:'▲▲ Strong buy',c:'up'}; if(v>0.1) return {t:'▲ Buy',c:'up'}; if(v>=-0.1) return {t:'● Neutral',c:'sub'}; if(v>=-0.5) return {t:'▼ Sell',c:'down'}; return {t:'▼▼ Strong sell',c:'down'}; }
const OL={positive:{v:3,t:'▲ Positive',c:'up'},neutral:{v:2,t:'● Neutral',c:'sub'},negative:{v:1,t:'▼ Negative',c:'down'}};
let sortKey = 'cap', sortDir = 'desc';
let pendingDel = null, delTimer = null;
function say(t, ok){ const m=document.getElementById('msg'); m.textContent=t; m.className=ok?'up':'down'; setTimeout(()=>{ if(m.textContent===t) m.textContent=''; },5000); }
function markDirty(){ dirty=true; showDirty(); }
function showDirty(){ document.getElementById('dirty').textContent = dirty ? '● Unsaved changes' : ''; document.getElementById('saveBtn').classList.toggle('primary', dirty); }
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

const COLS = [
  {k:'symbol',l:'Symbol',t:'str',w:'6.5%'},{k:'name',l:'Name',t:'str',w:'12.5%'},{k:'industry',l:'Sector',t:'str',w:'9%'},
  {k:'cap',l:'Market cap',t:'num',w:'8%'},
  {k:'price',l:'Price',t:'num',w:'7%'},{k:'pe',l:'PE',t:'num',w:'5.5%'},
  {k:'target',l:'Target value',t:'num',w:'7.5%'},{k:'upside',l:'Upside %',t:'num',w:'6.5%'},
  {k:'cfv',l:'Approx. value',t:'num',w:'7.5%'},{k:'cupside',l:'Approx. upside %',t:'num',w:'8.5%'},
  {k:'olv',l:'Outlook',t:'num',w:'8.5%'},{k:'tv',l:'Technical',t:'num',w:'8.5%'},{k:'del',l:'',t:'none',w:'5.5%'}
];

const FPE_DEFAULT=13.82;
function enrich(){
  const rows = stocks.map(r=>({...r,
    cap: (r.shares!=null && r.price!=null) ? r.shares*r.price : null
  }));
  return rows.map(r=>{
    const fpe = r.fpe ?? FPE_DEFAULT;
    const ok = r.pe!=null && r.pe>=3 && r.pe<=50 && r.price>0;
    const cfv = ok ? +(r.price*Math.min(Math.max((1+fpe/r.pe)/2,0.6),1.6)).toFixed(2) : null;
    const tv=techMap[r.symbol]!=null?techMap[r.symbol]:null;
    const o=outlook[r.symbol]||null, olv=o&&OL[o.rating]?OL[o.rating].v:null;
    return {...r, cfv, olv, o, tv,
      upside: (r.target!=null && r.price) ? +(((r.target-r.price)/r.price)*100).toFixed(2) : null,
      cupside: (cfv!=null && r.price) ? +(((cfv-r.price)/r.price)*100).toFixed(2) : null};
  });
}
const fmt=(n,s='',d=0)=> n==null||isNaN(n)?'—':n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})+s;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function head(){
  const h=document.getElementById('headRow');
  h.innerHTML=COLS.map(c=>c.t==='none'?`<th style="width:${c.w}"></th>`:`<th data-k="${c.k}" style="width:${c.w}">${c.l}${sortKey===c.k?(sortDir==='asc'?' ▲':' ▼'):''}</th>`).join('');
  h.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir=sortDir==='asc'?'desc':'asc';
    else {sortKey=k; sortDir=COLS.find(c=>c.k===k).t==='str'?'asc':'desc';}
    head(); render();
  });
}

function render(){
  const col=COLS.find(c=>c.k===sortKey), rows=enrich();
  rows.sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(col.t==='str') return sortDir==='asc'?String(x||'').localeCompare(String(y||'')):String(y||'').localeCompare(String(x||''));
    x=x==null?-Infinity:x; y=y==null?-Infinity:y;
    return sortDir==='asc'?x-y:y-x;
  });
  const tot=rows.reduce((s,r)=>s+(r.cap||0),0);
  document.getElementById('totals').textContent=`${stocks.length} stocks — Total market cap: ${fmt(tot)}`;
  const num=(r,f)=>`<td><input type="number" step="any" class="ci" data-f="${f}" value="${r[f]==null?'':Number(r[f]).toFixed(0)}"></td>`;
  document.getElementById('rows').innerHTML=rows.map(r=>{
    const u=r.upside==null?'sub':(r.upside>=0?'up':'down');
    return `<tr data-id="${r.id}">
      <td class="n"><b>${esc(r.symbol)}</b></td>
      <td class="tx" title="${esc(r.name)}">${esc(r.name)}</td>
      <td class="tx" title="${esc(r.industry)}">${esc(r.industry)}</td>
      <td class="n">${fmt(r.cap)}</td>
      <td class="n">${fmt(r.price,'',1)}</td>${num(r,'pe')}
      ${num(r,'target')}
      ${pctCell(r.upside)}
      <td>${fmt(r.cfv)}</td>
      ${pctCell(r.cupside)}
      ${r.o&&OL[r.o.rating]?`<td class="${OL[r.o.rating].c}" title="${esc(r.o.note+' (reviewed '+r.o.date+')')}"><b>${OL[r.o.rating].t}</b></td>`:'<td class="sub">—</td>'}
      ${(()=>{ const t=techLabel(r.tv); return t?`<td class="${t.c}" title="TradingView technical rating (moving averages + oscillators): ${r.tv.toFixed(2)}"><b>${t.t}</b></td>`:'<td class="sub">—</td>'; })()}
      <td class="act">${pendingDel===r.id?`<button class="del" data-del="${r.id}" style="font-weight:700;white-space:nowrap">Delete?</button>`:`<button class="del" data-del="${r.id}">✕</button>`}</td></tr>`;
  }).join('');
  document.querySelectorAll('[data-f]').forEach(i=>i.onchange=e=>{
    const s=stocks.find(x=>x.id===e.target.closest('tr').dataset.id), f=e.target.dataset.f;
    if(!s) return;
    if(['pe','target'].includes(f)){ const v=parseFloat(e.target.value); s[f]=isNaN(v)?null:v; }
    else s[f]=e.target.value;
    markDirty(); render();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;
    if(pendingDel===id){ clearTimeout(delTimer); pendingDel=null; stocks=stocks.filter(s=>s.id!==id); markDirty(); render(); return; }
    pendingDel=id; clearTimeout(delTimer); delTimer=setTimeout(()=>{ pendingDel=null; render(); },3000); render();
  });
}

const TICKERS_API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/data/tickers.json`;
const LATEST_API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/data/latest.json`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function getRepoJson(path){
  const tok=getTok();
  if(tok){ try{
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw'},cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){} }
  const r=await fetch(path+'?_='+Date.now()); if(!r.ok) throw new Error(path+' '+r.status);
  return r.json();
}
async function getLatest(){
  const tok=getTok();
  if(tok){ try{
    const r=await fetch(LATEST_API+'?ref='+BRANCH,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw'},cache:'no-store'});
    if(r.ok) return await r.json();
  }catch(e){} }
  const r=await fetch('data/latest.json?_='+Date.now()); if(!r.ok) throw new Error('latest.json '+r.status);
  return r.json();
}
function fillNew(s,e){
  s.price=e.price;
  if(!s.name && e.name) s.name=e.name;
  if(!s.industry && e.sector) s.industry=e.sector;
  if(s.shares==null && e.cap_bn && e.price) s.shares=e.cap_bn/e.price;
  if(s.pe==null && e.pe!=null) s.pe=e.pe;
}
async function addTicker(tok,sym){
  const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
  for(let a=0;a<2;a++){
    const r=await fetch(TICKERS_API+'?ref='+BRANCH,{headers:H,cache:'no-store'});
    if(r.status===401||r.status===403) throw new Error('token rejected');
    if(!r.ok) throw new Error('GitHub '+r.status);
    const j=await r.json();
    const arr=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
    if(arr.some(t=>t.symbol===sym)) return;
    arr.push({symbol:sym,name:''});
    const p=await fetch(TICKERS_API,{method:'PUT',headers:{...H,'Content-Type':'application/json'},
      body:JSON.stringify({message:'Add ticker '+sym,content:b64(JSON.stringify(arr,null,2)+'\n'),sha:j.sha,branch:BRANCH})});
    if(p.ok) return;
    if(p.status===401||p.status===403) throw new Error('token rejected');
    if(p.status!==409&&p.status!==422) throw new Error('GitHub '+p.status);
  }
  throw new Error('conflict, try again');
}
async function addStock(){
  const inp=document.getElementById('newSym');
  const sym=inp.value.trim().toUpperCase().replace(/^EGX:/,'').replace(/\.CA$/,'');
  if(!sym){ say('Enter a ticker first, e.g. COMI'); return; }
  if(!/^[A-Z0-9]{2,12}$/.test(sym)){ say('Enter a valid ticker, e.g. COMI'); return; }
  if(stocks.some(s=>s.symbol===sym)){ say(sym+' is already in the list'); return; }
  const tok=getTok();
  if(!tok){ document.getElementById('settings').style.display='flex'; say('Add a GitHub token in ⚙ to look up new tickers'); return; }
  const s={id:'s'+(nextId++),symbol:sym,name:'',industry:'',shares:null,pe:null,price:null,target:null};
  stocks.push(s); inp.value=''; markDirty(); render();
  say('Looking up '+sym+'… (about a minute)', true);
  try{ await addTicker(tok,sym); }catch(e){ say('Could not register '+sym+': '+e.message); return; }
  for(let i=0;i<24;i++){
    await sleep(POLL_MS);
    try{
      const j=await getLatest(), e=(j.stocks||[]).find(x=>x.symbol===sym);
      if(e){
        if(e.error){ say('No data found for '+sym+' — remove it with ✕'); return; }
        const cur=stocks.find(x=>x.id===s.id); if(!cur) return;
        fillNew(cur,e); markDirty(); render();
        say(sym+' loaded — add the rest and press Save', true); return;
      }
    }catch(e){}
  }
  say('Still waiting for '+sym+' — press ↻ Refresh prices in a minute');
}
document.getElementById('addRow').onclick=addStock;
document.getElementById('newSym').addEventListener('keydown',e=>{ if(e.key==='Enter') addStock(); });

const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function getSha(tok){
  const r=await fetch(API+'?ref='+BRANCH,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GitHub '+r.status);
  return (await r.json()).sha;
}
async function putFile(tok,content,sha){
  return fetch(API,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({message:'Update portfolio',content,branch:BRANCH,...(sha?{sha}:{})})});
}
async function save(){
  const tok=getTok();
  if(!tok){ document.getElementById('settings').style.display='flex'; say('Add a GitHub token in ⚙ to save'); return; }
  const btn=document.getElementById('saveBtn'); btn.disabled=true; say('Saving…', true);
  try{
    const content=b64(JSON.stringify({saved_at:new Date().toISOString(),stocks},null,2)+'\n');
    let r=await putFile(tok,content,await getSha(tok));
    if(r.status===409||r.status===422) r=await putFile(tok,content,await getSha(tok));
    if(r.status===401||r.status===403) throw new Error('Token rejected — check it in ⚙');
    if(!r.ok) throw new Error('Save failed ('+r.status+')');
    dirty=false; showDirty(); say('Saved ✓ '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), true);
  }catch(e){ say(e.message||'Save failed'); }
  btn.disabled=false;
}
document.getElementById('saveBtn').onclick=save;
document.getElementById('gearBtn').onclick=()=>{ const s=document.getElementById('settings'); s.style.display=s.style.display==='none'?'flex':'none'; document.getElementById('tok').value=getTok(); };
document.getElementById('tokSave').onclick=()=>{ setTok(document.getElementById('tok').value.trim()); document.getElementById('settings').style.display='none'; say('Token stored in this browser', true); loadData(); };
document.getElementById('tokClear').onclick=()=>{ setTok(''); document.getElementById('tok').value=''; say('Token removed', true); };

async function loadData(){
  const tok=getTok(); let data=null, how='';
  if(tok){
    try{
      const r=await fetch(API+'?ref='+BRANCH,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw'},cache:'no-store'});
      if(r.ok){ data=await r.json(); how='api'; } else say('Token rejected — loaded a read-only copy');
    }catch(e){}
  }
  if(!data){
    try{ const r=await fetch(PATH+'?_='+Date.now()); if(!r.ok) throw 0; data=await r.json(); }
    catch(e){ say('Could not load portfolio data'); return false; }
  }
  stocks=Array.isArray(data)?data:(data.stocks||[]);
  stocks.forEach(s=>{ if(s.pe===undefined) s.pe=(s.eps&&s.price)?s.price/s.eps:null; delete s.eps; });
  nextId=Math.max(0,...stocks.map(s=>parseInt(String(s.id||'s0').slice(1))||0))+1;
  try{ outlook=(await getRepoJson('data/outlook.json')).stocks||{}; }catch(e){ outlook={}; }
  dirty=false; showDirty(); render();
  return true;
}
async function fetchLatest(){
  const st=document.getElementById('upd');
  try{
    const j=await getLatest(), by={};
    (j.stocks||[]).forEach(s=>{ if(!s.error && s.price!=null) by[s.symbol]=s; if(s.tech!=null) techMap[s.symbol]=s.tech; });
    let n=0, filled=0;
    stocks.forEach(s=>{ const l=by[s.symbol]; if(!l) return; if(!s.name){ fillNew(s,l); filled++; } else s.price=l.price; if(l.name) s.name=l.name; if(l.sector) s.industry=l.sector; if(l.cap_bn && l.price) s.shares=l.cap_bn/l.price; n++; });
    if(filled) markDirty();
    if(n){ render(); st.textContent='Last update: '+new Date(j.updated_at).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})+' ('+n+' stocks, ~15 min delayed)'; }
    else st.textContent='No updated prices yet';
  }catch(e){ st.textContent='Could not read updated prices'; }
}
document.getElementById('refreshBtn').onclick=fetchLatest;
head(); loadData().then(ok=>{ if(ok) fetchLatest(); });
</script>
</body>
</html>
